spring.application.name=NSBM_Student_Hub

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nsbm_student_hub?CreateDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Qwerty@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationThatIsAtLeast256BitsLongForHS256Algorithm
jwt.expirationMs=86400000
